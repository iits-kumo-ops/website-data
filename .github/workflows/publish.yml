name: Build and Publish

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.filter.outputs.addons }}
      offer-description: ${{ steps.filter.outputs.offer-description }}
      onepager: ${{ steps.filter.outputs.onepager }}
      onepager-opentelekomcloud: ${{ steps.filter.outputs.onepager-opentelekomcloud }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            addons:
              - 'packages/addons/**'
            offer-description:
              - 'packages/offer-description/**'
            onepager:
              - 'packages/onepager/**'
            onepager-opentelekomcloud:
              - 'packages/onepager-opentelekomcloud/**'

  publish-addons:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.addons == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate and build
        run: bun run build
        working-directory: packages/addons

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@iits-kumo-ops"

      - name: Set package version
        run: npm version "$(node -p "require('./package.json').version")-$(git rev-parse --short HEAD)" --no-git-tag-version
        working-directory: packages/addons

      - name: Publish
        run: npm publish --access restricted
        working-directory: packages/addons
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-offer-description:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.offer-description == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build -- --ignore-warnings
        working-directory: packages/offer-description

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@iits-kumo-ops"

      - name: Set package version
        run: npm version "$(node -p "require('./package.json').version")-$(git rev-parse --short HEAD)" --no-git-tag-version
        working-directory: packages/offer-description

      - name: Publish
        run: npm publish --access restricted
        working-directory: packages/offer-description
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-onepager:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.onepager == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        working-directory: packages/onepager

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@iits-kumo-ops"

      - name: Set package version
        run: npm version "$(node -p "require('./package.json').version")-$(git rev-parse --short HEAD)" --no-git-tag-version
        working-directory: packages/onepager

      - name: Publish
        run: npm publish --access restricted
        working-directory: packages/onepager
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-onepager-opentelekomcloud:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.onepager-opentelekomcloud == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build -- --ignore-warnings
        working-directory: packages/onepager-opentelekomcloud

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@iits-kumo-ops"

      - name: Set package version
        run: npm version "$(node -p "require('./package.json').version")-$(git rev-parse --short HEAD)" --no-git-tag-version
        working-directory: packages/onepager-opentelekomcloud

      - name: Publish
        run: npm publish --access restricted
        working-directory: packages/onepager-opentelekomcloud
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-kumo-ops-website:
    needs: [publish-addons, publish-offer-description]
    if: always() && (needs.publish-addons.result == 'success' || needs.publish-offer-description.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v4
        with:
          repository: iits-kumo-ops/kumo-ops-website
          token: ${{ secrets.CONSUMER_REPO_PAT }}

      - name: Configure npm registry
        run: echo "@iits-kumo-ops:registry=https://npm.pkg.github.com" >> .npmrc && echo "//npm.pkg.github.com/:_authToken=${{ secrets.CONSUMER_REPO_PAT }}" >> .npmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Update data packages
        run: bun update @iits-kumo-ops/data-addons @iits-kumo-ops/data-offer-description

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CONSUMER_REPO_PAT }}
          commit-message: "chore: update @iits-kumo-ops/data-* packages"
          title: "chore: update @iits-kumo-ops/data-* packages"
          body: "Automated update of data packages from website-data."
          branch: deps/update-data-packages
          delete-branch: true

  update-opentelekomcloud-onepager:
    needs: [publish-onepager-opentelekomcloud]
    if: needs.publish-onepager-opentelekomcloud.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v4
        with:
          repository: iits-kumo-ops/opentelekomcloud-onepager
          token: ${{ secrets.CONSUMER_REPO_PAT }}

      - name: Configure npm registry
        run: echo "@iits-kumo-ops:registry=https://npm.pkg.github.com" >> .npmrc && echo "//npm.pkg.github.com/:_authToken=${{ secrets.CONSUMER_REPO_PAT }}" >> .npmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Update data packages
        run: bun update @iits-kumo-ops/data-onepager-opentelekomcloud

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CONSUMER_REPO_PAT }}
          commit-message: "chore: update @iits-kumo-ops/data-onepager-opentelekomcloud"
          title: "chore: update @iits-kumo-ops/data-onepager-opentelekomcloud"
          body: "Automated update of data packages from website-data."
          branch: deps/update-data-packages
          delete-branch: true

  update-onepagerkumoops:
    needs: [publish-onepager]
    if: needs.publish-onepager.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v4
        with:
          repository: iits-kumo-ops/onepagerkumoops
          token: ${{ secrets.CONSUMER_REPO_PAT }}

      - name: Configure npm registry
        run: echo "@iits-kumo-ops:registry=https://npm.pkg.github.com" >> .npmrc && echo "//npm.pkg.github.com/:_authToken=${{ secrets.CONSUMER_REPO_PAT }}" >> .npmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Update data packages
        run: bun update @iits-kumo-ops/data-onepager

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CONSUMER_REPO_PAT }}
          commit-message: "chore: update @iits-kumo-ops/data-onepager"
          title: "chore: update @iits-kumo-ops/data-onepager"
          body: "Automated update of data packages from website-data."
          branch: deps/update-data-packages
          delete-branch: true
