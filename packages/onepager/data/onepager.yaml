  hero.description:
    en: "If you're building a software product, writing the code is only half the job. You also need to run and maintain it for every customer—fast, secure, and reliable 24/7. That takes time, specialized skills, and real budget."
    de: "Wenn du ein Softwareprodukt entwickelst, ist die Softwareentwicklung nur die halbe Arbeit. Du musst es auch für jeden Kunden betreiben und warten – schnell, sicher und zuverlässig, rund um die Uhr. Das kostet Zeit, erfordert Spezialwissen und viel Geld."
    da: "Hvis du bygger et softwareprodukt, er det kun halvdelen af arbejdet at skrive koden. Du skal også køre og vedligeholde det for hver kunde — hurtigt, sikkert og pålideligt 24/7. Det kræver tid, specialiserede færdigheder og et reelt budget."
    es: "Si estás desarrollando un producto de software, escribir el código es solo la mitad del trabajo. También necesitas ejecutarlo y mantenerlo para cada cliente — rápido, seguro y confiable las 24 horas. Eso requiere tiempo, habilidades especializadas y presupuesto real."
    fr: "Si vous développez un produit logiciel, écrire le code n'est que la moitié du travail. Vous devez aussi l'exécuter et le maintenir pour chaque client — rapidement, en toute sécurité et de manière fiable 24h/24. Cela demande du temps, des compétences spécialisées et un vrai budget."
    it: "Se stai costruendo un prodotto software, scrivere il codice è solo metà del lavoro. Devi anche eseguirlo e mantenerlo per ogni cliente — veloce, sicuro e affidabile 24/7. Questo richiede tempo, competenze specializzate e un vero budget."
    nl: "Als je een softwareproduct bouwt, is het schrijven van de code slechts de helft van het werk. Je moet het ook draaien en onderhouden voor elke klant — snel, veilig en betrouwbaar 24/7. Dat kost tijd, gespecialiseerde vaardigheden en een echt budget."
    sv: "Om du bygger en mjukvaruprodukt är kodskrivning bara halva jobbet. Du måste också köra och underhålla den för varje kund — snabbt, säkert och pålitligt dygnet runt. Det kräver tid, specialiserade färdigheter och riktig budget."
    zh: "如果您正在构建软件产品，编写代码只是一半的工作。您还需要为每个客户运行和维护它——快速、安全、全天候可靠。这需要时间、专业技能和真正的预算。"

  hero.cta:
    en: "We'll handle CloudSecOps, for less than the cost of a single hire."
    de: "Wir übernehmen CloudSecOps – für weniger als die Kosten einer einzigen Neueinstellung."
    da: "Vi håndterer CloudSecOps for mindre end omkostningerne ved én enkelt ansættelse."
    es: "Nosotros nos encargamos de CloudSecOps, por menos del costo de una sola contratación."
    fr: "Nous gérons CloudSecOps, pour moins que le coût d'une seule embauche."
    it: "Gestiamo CloudSecOps per meno del costo di una singola assunzione."
    nl: "Wij regelen CloudSecOps voor minder dan de kosten van één enkele aanwerving."
    sv: "Vi hanterar CloudSecOps för mindre än kostnaden för en enda anställning."
    zh: "我们处理 CloudSecOps，费用低于单次招聘成本。"

  need.title:
    en: "Do I need CloudSecOps as a Service?"
    de: "Brauche ich CloudSecOps as a Service?"
    da: "Har jeg brug for CloudSecOps as a Service?"
    es: "¿Necesito CloudSecOps as a Service?"
    fr: "Ai-je besoin de CloudSecOps as a Service ?"
    it: "Ho bisogno di CloudSecOps as a Service?"
    nl: "Heb ik CloudSecOps as a Service nodig?"
    sv: "Behöver jag CloudSecOps as a Service?"
    zh: "我需要 CloudSecOps 即服务吗？"

  need.description:
    en: "You have software products that need reliable hosting and management? This is the solution for you. Select the services we should take care of, and we'll handle it — no need to hire extra Cloud/DevOps staff."
    de: "Sie haben Softwareprodukte, die zuverlässiges Hosting und Management benötigen? Das ist die Lösung für Sie. Wählen Sie die Services, die wir übernehmen sollen – ohne zusätzliches Cloud/DevOps-Personal einstellen zu müssen."
    da: "Har du softwareprodukter, der har brug for pålidelig hosting og administration? Dette er løsningen for dig. Vælg de tjenester, vi skal tage os af, og vi klarer det — uden at ansætte ekstra Cloud/DevOps-personale."
    es: "¿Tienes productos de software que necesitan alojamiento y gestión confiables? Esta es la solución para ti. Selecciona los servicios de los que debemos encargarnos, y lo manejamos — sin necesidad de contratar personal adicional de Cloud/DevOps."
    fr: "Vous avez des produits logiciels qui nécessitent un hébergement et une gestion fiables ? C'est la solution pour vous. Sélectionnez les services dont nous devons nous occuper, et nous nous en chargeons — pas besoin d'embaucher du personnel Cloud/DevOps supplémentaire."
    it: "Hai prodotti software che necessitano di hosting e gestione affidabili? Questa è la soluzione per te. Seleziona i servizi di cui dobbiamo occuparci, e ce ne occupiamo noi — senza assumere personale Cloud/DevOps aggiuntivo."
    nl: "Heb je softwareproducten die betrouwbare hosting en beheer nodig hebben? Dit is de oplossing voor jou. Selecteer de diensten waar wij voor moeten zorgen, en wij regelen het — geen extra Cloud/DevOps-personeel nodig."
    sv: "Har du mjukvaruprodukter som behöver pålitlig hosting och hantering? Detta är lösningen för dig. Välj de tjänster vi ska ta hand om, så hanterar vi det — inget behov av att anställa extra Cloud/DevOps-personal."
    zh: "您有需要可靠托管和管理的软件产品吗？这就是为您准备的解决方案。选择我们应该负责的服务，我们来处理——无需雇用额外的云/DevOps 人员。"

