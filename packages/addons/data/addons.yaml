        short_description:
          en: "Dedicated Azure OpenAI instance with better privacy than public chat tools; managed integration, updates, and maintenance."
          de: "Dedizierte Azure OpenAI-Instanz mit besserer Privatsphare als offentliche Chat-Tools; verwaltete Integration, Updates und Wartung."
          fr: "Instance Azure OpenAI dediee avec une meilleure confidentialite que les outils de chat publics ; integration, mises a jour et maintenance gerees."
