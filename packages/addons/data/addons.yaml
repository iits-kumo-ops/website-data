        detailed_description:
          en: "Get a dedicated instance of Azure OpenAI hosted either in your own Azure environment or within KumoOps infrastructure. This add-on provides a private AI instance where your company data remains isolated and is not used for further training. KumoOps takes care of integration, configuration, updates, and ongoing maintenance, ensuring that your private instance remains secure and compliant with data privacy requirements."
          de: "Erhalten Sie eine dedizierte Instanz von Azure OpenAI, gehostet entweder in Ihrer eigenen Azure-Umgebung oder innerhalb der KumoOps-Infrastruktur. Dieses Add-on bietet eine private KI-Instanz, bei der Ihre Unternehmensdaten isoliert bleiben und nicht fur weiteres Training verwendet werden. KumoOps kummert sich um Integration, Konfiguration, Updates und laufende Wartung und stellt sicher, dass Ihre private Instanz sicher bleibt und den Datenschutzanforderungen entspricht."
          fr: "Obtenez une instance dediee d'Azure OpenAI hebergee soit dans votre propre environnement Azure, soit au sein de l'infrastructure KumoOps. Cet add-on fournit une instance IA privee ou les donnees de votre entreprise restent isolees et ne sont pas utilisees pour un entrainement supplementaire. KumoOps s'occupe de l'integration, de la configuration, des mises a jour et de la maintenance continue, garantissant que votre instance privee reste securisee et conforme aux exigences de confidentialite des donnees."
          es: "Obtenga una instancia dedicada de Azure OpenAI alojada en su propio entorno Azure o dentro de la infraestructura de KumoOps. Este add-on proporciona una instancia de IA privada donde los datos de su empresa permanecen aislados y no se utilizan para entrenamiento adicional. KumoOps se encarga de la integracion, configuracion, actualizaciones y mantenimiento continuo, asegurando que su instancia privada permanezca segura y conforme con los requisitos de privacidad de datos."
          it: "Ottieni un'istanza dedicata di Azure OpenAI ospitata nel tuo ambiente Azure o all'interno dell'infrastruttura KumoOps. Questo add-on fornisce un'istanza IA privata dove i dati della tua azienda rimangono isolati e non vengono utilizzati per ulteriore addestramento. KumoOps si occupa di integrazione, configurazione, aggiornamenti e manutenzione continua, garantendo che la tua istanza privata rimanga sicura e conforme ai requisiti di privacy dei dati."
          nl: "Krijg een toegewijde instantie van Azure OpenAI gehost in uw eigen Azure-omgeving of binnen de KumoOps-infrastructuur. Deze add-on biedt een prive AI-instantie waar uw bedrijfsgegevens geisoleerd blijven en niet worden gebruikt voor verdere training. KumoOps verzorgt integratie, configuratie, updates en doorlopend onderhoud, en zorgt ervoor dat uw prive-instantie veilig blijft en voldoet aan de vereisten voor gegevensprivacy."
          da: "Fa en dedikeret instans af Azure OpenAI hostet enten i dit eget Azure-miljo eller inden for KumoOps-infrastrukturen. Denne add-on giver en privat AI-instans, hvor dine virksomhedsdata forbliver isoleret og ikke bruges til yderligere traening. KumoOps tager sig af integration, konfiguration, opdateringer og lobende vedligeholdelse og sikrer, at din private instans forbliver sikker og i overensstemmelse med databeskyttelseskrav."
          sv: "Fa en dedikerad instans av Azure OpenAI hostad antingen i din egen Azure-miljo eller inom KumoOps-infrastrukturen. Denna add-on ger en privat AI-instans dar dina foretagsdata forblir isolerade och inte anvands for vidare traning. KumoOps tar hand om integration, konfiguration, uppdateringar och lopande underhall och sakerstaller att din privata instans forblir saker och i enlighet med dataskyddskrav."

      homeport_ai:
        label:
          en: "Private genAI Homeport.ai"
          de: "Private genAI Homeport.ai"
          fr: "genAI prive Homeport.ai"
          es: "genAI privado Homeport.ai"
          it: "genAI Privato Homeport.ai"
          nl: "Private genAI Homeport.ai"
          da: "Private genAI Homeport.ai"
          sv: "Private genAI Homeport.ai"
        pricing:
          en: "EUR59/user/month"
          de: "59 EUR/Benutzer/Monat"
          fr: "59 EUR/utilisateur/mois"
          es: "EUR59/usuario/mes"
          it: "EUR59/utente/mese"
          nl: "EUR59/gebruiker/maand"
          da: "EUR59/bruger/maned"
          sv: "EUR59/anvandare/manad"
        short_description:
          en: "Centralize internal knowledge into secure workspaces; hosted on Open Telekom Cloud (EU) with KumoOps-managed setup and ops."
          de: "Zentralisieren Sie internes Wissen in sicheren Workspaces; gehostet auf Open Telekom Cloud (EU) mit KumoOps-verwaltetem Setup und Betrieb."
          fr: "Centralisez les connaissances internes dans des espaces de travail securises ; heberge sur Open Telekom Cloud (UE) avec configuration et operations gerees par KumoOps."
          es: "Centralice el conocimiento interno en espacios de trabajo seguros; alojado en Open Telekom Cloud (UE) con configuracion y operaciones gestionadas por KumoOps."
          it: "Centralizza la conoscenza interna in workspace sicuri; ospitato su Open Telekom Cloud (UE) con setup e operazioni gestite da KumoOps."
          nl: "Centraliseer interne kennis in beveiligde workspaces; gehost op Open Telekom Cloud (EU) met door KumoOps beheerde setup en operaties."
          da: "Centraliser intern viden i sikre workspaces; hostet pa Open Telekom Cloud (EU) med KumoOps-administreret setup og drift."
          sv: "Centralisera intern kunskap i sakra workspaces; hostad pa Open Telekom Cloud (EU) med KumoOps-hanterad setup och drift."
        detailed_description:
          en: "Unlock the full potential of AI with Homeport.ai, the AI operating system for your company. This add-on centralizes your internal knowledge base—including documents, wikis, and contracts—and organizes your data into personalized, secure workspaces. It also enables the integration of your preferred AI models, so you can tailor the solution to meet your unique needs. Hosted on the Open Telekom Cloud in the EU, this solution ensures that your data remains safely stored in compliance with local data protection standards, while KumoOps handles the setup and ongoing management."
          de: "Erschliessen Sie das volle Potenzial von KI mit Homeport.ai, dem KI-Betriebssystem fur Ihr Unternehmen. Dieses Add-on zentralisiert Ihre interne Wissensbasis - einschliesslich Dokumente, Wikis und Vertrage - und organisiert Ihre Daten in personalisierten, sicheren Workspaces. Es ermoglicht auch die Integration Ihrer bevorzugten KI-Modelle, sodass Sie die Losung auf Ihre individuellen Bedurfnisse zuschneiden konnen. Gehostet auf der Open Telekom Cloud in der EU stellt diese Losung sicher, dass Ihre Daten gemass lokalen Datenschutzstandards sicher gespeichert bleiben, wahrend KumoOps Setup und laufendes Management ubernimmt."
          fr: "Liberez tout le potentiel de l'IA avec Homeport.ai, le systeme d'exploitation IA pour votre entreprise. Cet add-on centralise votre base de connaissances interne, y compris les documents, les wikis et les contrats, et organise vos donnees dans des espaces de travail personnalises et securises. Il permet egalement l'integration de vos modeles IA preferes, afin que vous puissiez adapter la solution a vos besoins uniques. Heberge sur Open Telekom Cloud dans l'UE, cette solution garantit que vos donnees restent stockees en toute securite conformement aux normes locales de protection des donnees, tandis que KumoOps gere la configuration et la gestion continue."
          es: "Desbloquee todo el potencial de la IA con Homeport.ai, el sistema operativo de IA para su empresa. Este add-on centraliza su base de conocimiento interno, incluyendo documentos, wikis y contratos, y organiza sus datos en espacios de trabajo personalizados y seguros. Tambien permite la integracion de sus modelos de IA preferidos, para que pueda adaptar la solucion a sus necesidades unicas. Alojado en Open Telekom Cloud en la UE, esta solucion garantiza que sus datos permanezcan almacenados de forma segura en cumplimiento con los estandares de proteccion de datos locales, mientras KumoOps se encarga de la configuracion y la gestion continua."
          it: "Sblocca il pieno potenziale dell'IA con Homeport.ai, il sistema operativo IA per la tua azienda. Questo add-on centralizza la tua base di conoscenza interna, inclusi documenti, wiki e contratti, e organizza i tuoi dati in workspace personalizzati e sicuri. Consente anche l'integrazione dei tuoi modelli IA preferiti, cosi puoi adattare la soluzione alle tue esigenze uniche. Ospitato su Open Telekom Cloud nell'UE, questa soluzione garantisce che i tuoi dati rimangano archiviati in modo sicuro in conformita con gli standard locali di protezione dei dati, mentre KumoOps gestisce setup e gestione continua."
          nl: "Ontgrendel het volledige potentieel van AI met Homeport.ai, het AI-besturingssysteem voor uw bedrijf. Deze add-on centraliseert uw interne kennisbank - inclusief documenten, wiki's en contracten - en organiseert uw gegevens in gepersonaliseerde, beveiligde workspaces. Het maakt ook integratie van uw favoriete AI-modellen mogelijk, zodat u de oplossing kunt afstemmen op uw unieke behoeften. Gehost op Open Telekom Cloud in de EU garandeert deze oplossing dat uw gegevens veilig worden opgeslagen in overeenstemming met lokale gegevensbeschermingsstandaarden, terwijl KumoOps de setup en doorlopend beheer verzorgt."
          da: "Las op for det fulde potentiale af AI med Homeport.ai, AI-operativsystemet for din virksomhed. Denne add-on centraliserer din interne videnbase - inkl. dokumenter, wikis og kontrakter - og organiserer dine data i personaliserede, sikre workspaces. Det muliggor ogsa integration af dine foretrukne AI-modeller, sa du kan skraeddersy losningen til dine unikke behov. Hostet pa Open Telekom Cloud i EU sikrer denne losning, at dine data forbliver sikkert gemt i overensstemmelse med lokale databeskyttelsesstandarder, mens KumoOps handterer setup og lobende administration."
          sv: "Las upp den fulla potentialen av AI med Homeport.ai, AI-operativsystemet for ditt foretag. Denna add-on centraliserar din interna kunskapsbas - inklusive dokument, wikis och kontrakt - och organiserar dina data i personaliserade, sakra workspaces. Det mojliggor ocksa integration av dina foredragna AI-modeller, sa att du kan skraddarsy losningen for dina unika behov. Hostad pa Open Telekom Cloud i EU sakerstaller denna losning att dina data forblir sakert lagrade i enlighet med lokala dataskyddsstandarder, medan KumoOps hanterar setup och lopande hantering."

