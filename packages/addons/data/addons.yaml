          it: "Il costo del supporto 24/7 e calcolato come aumento percentuale sull'offerta totale CloudSecOps as a Service (add-on inclusi). L'opzione globale e un aumento del 30% ed e fornita da un team distribuito di dipendenti in tutto il mondo."
