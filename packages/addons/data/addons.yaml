      cloud_cost_optimization:
        label:
          en: "Cloud Cost Optimization"
          de: "Cloud-Kostenoptimierung"
          fr: "Optimisation des couts cloud"
          es: "Optimizacion de costos en la nube"
          it: "Ottimizzazione Costi Cloud"
          nl: "Cloud-kostenoptimalisatie"
          da: "Cloud-omkostningsoptimering"
          sv: "Molnkostnadsoptimering"
        pricing:
          en: "EUR350/month"
          de: "350 EUR/Monat"
          fr: "350 EUR/mois"
          es: "EUR350/mes"
          it: "EUR350/mese"
          nl: "EUR350/maand"
          da: "EUR350/maned"
          sv: "EUR350/manad"
        short_description:
          en: "Periodic analysis, reporting, right-sizing, reserved instance planning, and automated cost alerting. Only billed if at least EUR1,000/month can be saved."
          de: "Periodische Analyse, Berichterstattung, Right-Sizing, Reserved Instance Planung und automatisierte Kostenbenachrichtigungen. Wird nur berechnet, wenn mindestens 1.000 EUR/Monat eingespart werden konnen."
          fr: "Analyse periodique, rapports, dimensionnement approprie, planification des instances reservees et alertes de couts automatisees. Facture uniquement si au moins 1 000 EUR/mois peuvent etre economies."
          es: "Analisis periodico, informes, ajuste de tamano, planificacion de instancias reservadas y alertas de costos automatizadas. Solo se factura si se pueden ahorrar al menos EUR1.000/mes."
          it: "Analisi periodica, reportistica, right-sizing, pianificazione istanze riservate e avvisi automatici sui costi. Addebitato solo se possono essere risparmiati almeno EUR1.000/mese."
          nl: "Periodieke analyse, rapportage, right-sizing, reserved instance-planning en geautomatiseerde kostenwaarschuwingen. Alleen gefactureerd als minimaal EUR1.000/maand kan worden bespaard."
          da: "Periodisk analyse, rapportering, right-sizing, reserved instance-planlaegning og automatiske omkostningsadvarsler. Faktureres kun, hvis mindst EUR1.000/maned kan spares."
          sv: "Periodisk analys, rapportering, right-sizing, reserved instance-planering och automatiska kostnadsvarningar. Faktureras endast om minst EUR1 000/manad kan sparas."
        detailed_description:
          en: "Comprehensive cloud cost management including periodic analysis, detailed reporting, right-sizing recommendations, reserved instance planning, auto-scaling advice, and automated cost alerting to efficiently control and optimize your cloud expenditure. This add-on will only be billed if at least 1000EUR per month can be saved. If it is not a simple setup (multi tenancy, C5 compliant etc.) or at least 3 stages are present we would recommend booking this package."
          de: "Umfassendes Cloud-Kostenmanagement einschliesslich periodischer Analyse, detaillierter Berichterstattung, Right-Sizing-Empfehlungen, Reserved Instance Planung, Auto-Scaling-Beratung und automatisierter Kostenbenachrichtigungen zur effizienten Kontrolle und Optimierung Ihrer Cloud-Ausgaben. Dieses Add-on wird nur berechnet, wenn mindestens 1.000 EUR pro Monat eingespart werden konnen."
          fr: "Gestion complete des couts cloud comprenant l'analyse periodique, les rapports detailles, les recommandations de dimensionnement approprie, la planification des instances reservees, les conseils de mise a l'echelle automatique et les alertes de couts automatisees pour controler et optimiser efficacement vos depenses cloud. Cet add-on ne sera facture que si au moins 1 000 EUR par mois peuvent etre economies."
          es: "Gestion integral de costos en la nube que incluye analisis periodico, informes detallados, recomendaciones de ajuste de tamano, planificacion de instancias reservadas, asesoramiento de auto-scaling y alertas de costos automatizadas para controlar y optimizar eficientemente sus gastos en la nube. Este add-on solo se facturara si se pueden ahorrar al menos EUR1.000 por mes."
          it: "Gestione completa dei costi cloud inclusa analisi periodica, reportistica dettagliata, raccomandazioni di right-sizing, pianificazione delle istanze riservate, consulenza sull'auto-scaling e avvisi automatici sui costi per controllare e ottimizzare efficacemente la tua spesa cloud. Questo add-on verra addebitato solo se possono essere risparmiati almeno EUR1.000 al mese."
          nl: "Uitgebreid cloudkostenbeheer inclusief periodieke analyse, gedetailleerde rapportage, right-sizing-aanbevelingen, reserved instance-planning, auto-scaling-advies en geautomatiseerde kostenwaarschuwingen om uw clouduitgaven efficient te beheersen en optimaliseren. Deze add-on wordt alleen gefactureerd als minimaal EUR1.000 per maand kan worden bespaard."
          da: "Omfattende cloud-omkostningsstyring inkl. periodisk analyse, detaljeret rapportering, right-sizing-anbefalinger, reserved instance-planlaegning, auto-scaling-radgivning og automatiske omkostningsadvarsler for effektivt at kontrollere og optimere dine cloud-udgifter. Denne add-on faktureres kun, hvis mindst EUR1.000 pr. maned kan spares."
          sv: "Omfattande molnkostnadshantering inklusive periodisk analys, detaljerad rapportering, right-sizing-rekommendationer, reserved instance-planering, auto-scaling-radgivning och automatiska kostnadsvarningar for att effektivt kontrollera och optimera dina molnutgifter. Denna add-on faktureras endast om minst EUR1 000 per manad kan sparas."

      message_broker:
        label:
          en: "Message Broker"
          de: "Message Broker"
          fr: "Message Broker"
          es: "Message Broker"
          it: "Message Broker"
          nl: "Message Broker"
          da: "Message Broker"
          sv: "Message Broker"
        pricing:
          en: "EUR100/month per setup"
          de: "100 EUR/Monat pro Setup"
          fr: "100 EUR/mois par configuration"
          es: "EUR100/mes por configuracion"
          it: "EUR100/mese per setup"
          nl: "EUR100/maand per setup"
          da: "EUR100/maned pr. setup"
          sv: "EUR100/manad per setup"
        short_description:
          en: "Fully managed messaging infrastructure (Kafka, Service Bus, RabbitMQ, etc.) including setup, monitoring, security updates, and troubleshooting."
          de: "Vollstandig verwaltete Messaging-Infrastruktur (Kafka, Service Bus, RabbitMQ usw.) einschliesslich Setup, Uberwachung, Sicherheitsupdates und Fehlerbehebung."
          fr: "Infrastructure de messagerie entierement geree (Kafka, Service Bus, RabbitMQ, etc.) comprenant la configuration, la surveillance, les mises a jour de securite et le depannage."
          es: "Infraestructura de mensajeria totalmente gestionada (Kafka, Service Bus, RabbitMQ, etc.) incluyendo configuracion, monitoreo, actualizaciones de seguridad y resolucion de problemas."
          it: "Infrastruttura di messaggistica completamente gestita (Kafka, Service Bus, RabbitMQ, ecc.) inclusi setup, monitoraggio, aggiornamenti di sicurezza e troubleshooting."
          nl: "Volledig beheerde messaging-infrastructuur (Kafka, Service Bus, RabbitMQ, enz.) inclusief setup, monitoring, beveiligingsupdates en probleemoplossing."
          da: "Fuldt administreret messaging-infrastruktur (Kafka, Service Bus, RabbitMQ osv.) inkl. setup, overvagning, sikkerhedsopdateringer og fejlfinding."
          sv: "Fullt hanterad meddelandeinfrastruktur (Kafka, Service Bus, RabbitMQ osv.) inklusive setup, overvakning, sakerhetsuppdateringar och felsökning."
        detailed_description:
          en: "Our Message Broker Management Service provides a fully managed environment for your messaging infrastructure. Whether you choose Kafka, Service Bus, RabbitMQ, or another solution, KumoOps will handle the initial setup, configuration, and ongoing maintenance. This includes logging, monitoring, security updates, and troubleshooting support to ensure efficient and reliable communication between your distributed services."
          de: "Unser Message Broker Management Service bietet eine vollstandig verwaltete Umgebung fur Ihre Messaging-Infrastruktur. Ob Sie Kafka, Service Bus, RabbitMQ oder eine andere Losung wahlen - KumoOps ubernimmt das initiale Setup, die Konfiguration und die laufende Wartung. Dies umfasst Logging, Monitoring, Sicherheitsupdates und Support bei der Fehlerbehebung, um eine effiziente und zuverlassige Kommunikation zwischen Ihren verteilten Services zu gewahrleisten."
          fr: "Notre service de gestion Message Broker fournit un environnement entierement gere pour votre infrastructure de messagerie. Que vous choisissiez Kafka, Service Bus, RabbitMQ ou une autre solution, KumoOps gerera la configuration initiale, la configuration et la maintenance continue. Cela comprend la journalisation, la surveillance, les mises a jour de securite et le support de depannage pour garantir une communication efficace et fiable entre vos services distribues."
          es: "Nuestro servicio de gestion de Message Broker proporciona un entorno totalmente gestionado para su infraestructura de mensajeria. Ya sea que elija Kafka, Service Bus, RabbitMQ u otra solucion, KumoOps se encargara de la configuracion inicial, la configuracion y el mantenimiento continuo. Esto incluye registro, monitoreo, actualizaciones de seguridad y soporte de resolucion de problemas para garantizar una comunicacion eficiente y confiable entre sus servicios distribuidos."
          it: "Il nostro servizio di gestione Message Broker fornisce un ambiente completamente gestito per la tua infrastruttura di messaggistica. Sia che tu scelga Kafka, Service Bus, RabbitMQ o un'altra soluzione, KumoOps gestira il setup iniziale, la configurazione e la manutenzione continua. Questo include logging, monitoraggio, aggiornamenti di sicurezza e supporto per il troubleshooting per garantire una comunicazione efficiente e affidabile tra i tuoi servizi distribuiti."
          nl: "Onze Message Broker Management Service biedt een volledig beheerde omgeving voor uw messaging-infrastructuur. Of u nu kiest voor Kafka, Service Bus, RabbitMQ of een andere oplossing, KumoOps verzorgt de initiele setup, configuratie en doorlopend onderhoud. Dit omvat logging, monitoring, beveiligingsupdates en ondersteuning bij probleemoplossing om efficiente en betrouwbare communicatie tussen uw gedistribueerde services te garanderen."
          da: "Vores Message Broker Management Service tilbyder et fuldt administreret miljo til din messaging-infrastruktur. Uanset om du vaelger Kafka, Service Bus, RabbitMQ eller en anden losning, vil KumoOps handtere det indledende setup, konfiguration og lobende vedligeholdelse. Dette inkluderer logging, overvagning, sikkerhedsopdateringer og fejlfindingssupport for at sikre effektiv og palidelig kommunikation mellem dine distribuerede tjenester."
          sv: "Var Message Broker Management Service tillhandahaller en fullt hanterad miljo for din meddelandeinfrastruktur. Oavsett om du valjer Kafka, Service Bus, RabbitMQ eller en annan losning, kommer KumoOps att hantera det initiala setup, konfiguration och lopande underhall. Detta inkluderar loggning, overvakning, sakerhetsuppdateringar och felsokningssupport for att sakerstalla effektiv och palitlig kommunikation mellan dina distribuerade tjanster."

      additional_stage:
        label:
          en: "Additional Stage"
          de: "Zusatzliche Stage"
          fr: "Etape supplementaire"
          es: "Etapa adicional"
          it: "Stage Aggiuntivo"
          nl: "Extra Stage"
          da: "Ekstra Stage"
          sv: "Ytterligare Stage"
        pricing:
          en: "EUR1,500/month"
          de: "1.500 EUR/Monat"
          fr: "1 500 EUR/mois"
          es: "EUR1.500/mes"
          it: "EUR1.500/mese"
          nl: "EUR1.500/maand"
          da: "EUR1.500/maned"
          sv: "EUR1 500/manad"
        short_description:
          en: "Adds support for an additional stage (staging/testing/QA) with the same IaC and GitOps principles as dev and prod."
          de: "Fugt Unterstutzung fur eine zusatzliche Stage (Staging/Testing/QA) mit denselben IaC- und GitOps-Prinzipien wie Dev und Prod hinzu."
          fr: "Ajoute le support pour une etape supplementaire (staging/testing/QA) avec les memes principes IaC et GitOps que dev et prod."
          es: "Anade soporte para una etapa adicional (staging/testing/QA) con los mismos principios IaC y GitOps que dev y prod."
          it: "Aggiunge supporto per uno stage aggiuntivo (staging/testing/QA) con gli stessi principi IaC e GitOps di dev e prod."
          nl: "Voegt ondersteuning toe voor een extra stage (staging/testing/QA) met dezelfde IaC- en GitOps-principes als dev en prod."
          da: "Tilfojer support for en ekstra stage (staging/testing/QA) med samme IaC- og GitOps-principper som dev og prod."
          sv: "Lagger till support for en ytterligare stage (staging/testing/QA) med samma IaC- och GitOps-principer som dev och prod."
        detailed_description:
          en: "Extends the Foundation Setup and Maintenance service to include support for an additional stage, such as staging, testing, or quality assurance. This package provides the same level of infrastructure as code and GitOps principles implementation, provisioning and configuration asset validation, and ongoing support (monitoring and maintenance) for the additional stage. It can be booked multiple times to support multiple additional stages. If you need services like a central Secret Management Tool like HashiCorp Vault or IAM (for example Keycloak) you need to book this addon as additional infra stage."
          de: "Erweitert den Foundation Setup und Maintenance Service um Unterstutzung fur eine zusatzliche Stage wie Staging, Testing oder Qualitatssicherung. Dieses Paket bietet das gleiche Niveau an Infrastructure as Code und GitOps-Prinzipien, Bereitstellung und Validierung von Konfigurationsassets sowie laufenden Support (Monitoring und Wartung) fur die zusatzliche Stage. Es kann mehrfach gebucht werden, um mehrere zusatzliche Stages zu unterstutzen."
          fr: "Etend le service Foundation Setup and Maintenance pour inclure le support d'une etape supplementaire, telle que le staging, les tests ou l'assurance qualite. Ce pack fournit le meme niveau de mise en oeuvre des principes d'infrastructure as code et GitOps, de provisionnement et de validation des actifs de configuration, et de support continu (surveillance et maintenance) pour l'etape supplementaire. Il peut etre reserve plusieurs fois pour prendre en charge plusieurs etapes supplementaires."
          es: "Extiende el servicio Foundation Setup and Maintenance para incluir soporte para una etapa adicional, como staging, testing o garantia de calidad. Este paquete proporciona el mismo nivel de implementacion de principios de infrastructure as code y GitOps, aprovisionamiento y validacion de activos de configuracion, y soporte continuo (monitoreo y mantenimiento) para la etapa adicional. Puede reservarse varias veces para soportar multiples etapas adicionales."
          it: "Estende il servizio Foundation Setup and Maintenance per includere il supporto per uno stage aggiuntivo, come staging, testing o quality assurance. Questo pacchetto fornisce lo stesso livello di implementazione dei principi infrastructure as code e GitOps, provisioning e validazione degli asset di configurazione e supporto continuo (monitoraggio e manutenzione) per lo stage aggiuntivo. Può essere prenotato più volte per supportare più stage aggiuntivi."
          nl: "Breidt de Foundation Setup en Maintenance-service uit met ondersteuning voor een extra stage, zoals staging, testing of quality assurance. Dit pakket biedt hetzelfde niveau van infrastructure as code en GitOps-principes implementatie, provisioning en validatie van configuratie-assets, en doorlopende ondersteuning (monitoring en onderhoud) voor de extra stage. Het kan meerdere keren worden geboekt om meerdere extra stages te ondersteunen."
          da: "Udvider Foundation Setup og Maintenance-servicen til at inkludere support for en ekstra stage, sasom staging, testing eller kvalitetssikring. Denne pakke giver samme niveau af infrastructure as code og GitOps-principper implementering, provisionering og validering af konfigurationsaktiver samt lobende support (overvagning og vedligeholdelse) for den ekstra stage. Den kan bookes flere gange for at understotte flere ekstra stages."
          sv: "Utokar Foundation Setup och Maintenance-tjansten till att inkludera support for en ytterligare stage, sasom staging, testing eller kvalitetssakring. Detta paket ger samma niva av infrastructure as code och GitOps-principimplementering, provisionering och validering av konfigurationstillgangar samt lopande support (overvakning och underhall) for den ytterligare stagen. Det kan bokas flera ganger for att stodja flera ytterligare stages."

