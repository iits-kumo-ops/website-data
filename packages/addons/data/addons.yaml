    items:
      migration:
        label:
          en: "Migration of Existing Workload"
          de: "Migration bestehender Workloads"
          fr: "Migration des charges de travail existantes"
          es: "Migracion de cargas de trabajo existentes"
          it: "Migrazione di carichi di lavoro esistenti"
          nl: "Migratie van bestaande workloads"
          da: "Migration af eksisterende workloads"
          sv: "Migrering av befintliga arbetsbelastningar"
        pricing:
          en: "Based on workload complexity"
          de: "Basierend auf Workload-Komplexitat"
          fr: "Base sur la complexite de la charge de travail"
          es: "Basado en la complejidad de la carga de trabajo"
          it: "Basato sulla complessita del carico di lavoro"
          nl: "Gebaseerd op workload-complexiteit"
          da: "Baseret pa workload-kompleksitet"
          sv: "Baserat pa arbetsbelastningskomplexitet"
        short_description:
          en: "Receive professional assistance for migrating your existing workloads into the KumoOps stack. Our experts collaborate with your team to assess your current environment and design a tailored migration plan, ensuring a smooth transition with minimal downtime."
          de: "Erhalten Sie professionelle Unterstutzung bei der Migration Ihrer bestehenden Workloads in den KumoOps-Stack. Unsere Experten arbeiten mit Ihrem Team zusammen, um Ihre aktuelle Umgebung zu bewerten und einen massgeschneiderten Migrationsplan zu erstellen."
          fr: "Recevez une assistance professionnelle pour migrer vos charges de travail existantes vers la stack KumoOps. Nos experts collaborent avec votre equipe pour evaluer votre environnement actuel et concevoir un plan de migration personnalise."
          es: "Reciba asistencia profesional para migrar sus cargas de trabajo existentes al stack de KumoOps. Nuestros expertos colaboran con su equipo para evaluar su entorno actual y disenar un plan de migracion personalizado."
          it: "Ricevi assistenza professionale per migrare i tuoi carichi di lavoro esistenti nello stack KumoOps. I nostri esperti collaborano con il tuo team per valutare il tuo ambiente attuale e progettare un piano di migrazione personalizzato."
          nl: "Ontvang professionele hulp bij het migreren van uw bestaande workloads naar de KumoOps-stack. Onze experts werken samen met uw team om uw huidige omgeving te beoordelen en een op maat gemaakt migratieplan te ontwerpen."
          da: "Modtag professionel assistance til at migrere dine eksisterende workloads til KumoOps-stakken. Vores eksperter samarbejder med dit team om at vurdere dit nuvaerende miljo og designe en skraeddersyet migrationsplan."
          sv: "Fa professionell hjalp med att migrera dina befintliga arbetsbelastningar till KumoOps-stacken. Vara experter samarbetar med ditt team for att utvardera din nuvarande miljo och designa en skraddarsydd migreringsplan."
        detailed_description:
          en: "Receive professional assistance for migrating your existing workloads into the CloudSecOps as a Service stack. Our experts collaborate with your team to assess your current environment and design a tailored migration plan. This service ensures a smooth transition with minimal downtime and operational disruption. Pricing is determined based on workload complexity and specific requirements. To ensure a successful transition, we require the support and collaboration of your internal development team with our KumoOps team."
          de: "Erhalten Sie professionelle Unterstutzung bei der Migration Ihrer bestehenden Workloads in den CloudSecOps as a Service Stack. Unsere Experten arbeiten mit Ihrem Team zusammen, um Ihre aktuelle Umgebung zu bewerten und einen massgeschneiderten Migrationsplan zu erstellen. Dieser Service gewahrleistet einen reibungslosen Ubergang mit minimaler Ausfallzeit und betrieblicher Unterbrechung. Die Preisgestaltung richtet sich nach der Workload-Komplexitat und den spezifischen Anforderungen. Fur einen erfolgreichen Ubergang benotigen wir die Unterstutzung und Zusammenarbeit Ihres internen Entwicklungsteams mit unserem KumoOps-Team."
          fr: "Recevez une assistance professionnelle pour migrer vos charges de travail existantes vers la stack CloudSecOps as a Service. Nos experts collaborent avec votre equipe pour evaluer votre environnement actuel et concevoir un plan de migration personnalise. Ce service garantit une transition fluide avec un temps d'arret minimal et une perturbation operationnelle minimale. Le prix est determine en fonction de la complexite de la charge de travail et des exigences specifiques. Pour garantir une transition reussie, nous avons besoin du soutien et de la collaboration de votre equipe de developpement interne avec notre equipe KumoOps."
          es: "Reciba asistencia profesional para migrar sus cargas de trabajo existentes al stack de CloudSecOps as a Service. Nuestros expertos colaboran con su equipo para evaluar su entorno actual y disenar un plan de migracion personalizado. Este servicio garantiza una transicion fluida con un tiempo de inactividad minimo y una interrupcion operativa minima. El precio se determina en funcion de la complejidad de la carga de trabajo y los requisitos especificos. Para garantizar una transicion exitosa, requerimos el apoyo y la colaboracion de su equipo de desarrollo interno con nuestro equipo de KumoOps."
          it: "Ricevi assistenza professionale per migrare i tuoi carichi di lavoro esistenti nello stack CloudSecOps as a Service. I nostri esperti collaborano con il tuo team per valutare il tuo ambiente attuale e progettare un piano di migrazione personalizzato. Questo servizio garantisce una transizione fluida con tempi di inattivita minimi e interruzioni operative minime. Il prezzo e determinato in base alla complessita del carico di lavoro e ai requisiti specifici. Per garantire una transizione di successo, richiediamo il supporto e la collaborazione del tuo team di sviluppo interno con il nostro team KumoOps."
          nl: "Ontvang professionele hulp bij het migreren van uw bestaande workloads naar de CloudSecOps as a Service-stack. Onze experts werken samen met uw team om uw huidige omgeving te beoordelen en een op maat gemaakt migratieplan te ontwerpen. Deze service zorgt voor een soepele overgang met minimale downtime en operationele verstoring. De prijs wordt bepaald op basis van de complexiteit van de workload en specifieke vereisten. Om een succesvolle overgang te garanderen, hebben we de ondersteuning en samenwerking nodig van uw interne ontwikkelteam met ons KumoOps-team."
          da: "Modtag professionel assistance til at migrere dine eksisterende workloads til CloudSecOps as a Service-stakken. Vores eksperter samarbejder med dit team om at vurdere dit nuvaerende miljo og designe en skraeddersyet migrationsplan. Denne service sikrer en glidende overgang med minimal nedetid og driftsforstyrrelser. Prissaetningen bestemmes baseret pa workload-kompleksitet og specifikke krav. For at sikre en vellykket overgang kraever vi stotte og samarbejde fra dit interne udviklingsteam med vores KumoOps-team."
          sv: "Fa professionell hjalp med att migrera dina befintliga arbetsbelastningar till CloudSecOps as a Service-stacken. Vara experter samarbetar med ditt team for att utvardera din nuvarande miljo och designa en skraddarsydd migreringsplan. Denna tjanst sakerställer en smidig overgang med minimal stillestandstid och driftstorningar. Prissattningen bestams baserat pa arbetsbelastningskomplexitet och specifika krav. For att sakerstalla en framgangsrik overgang kraver vi stod och samarbete fran ditt interna utvecklingsteam med vart KumoOps-team."

      capacity_boost:
        label:
          en: "Capacity Boost Package"
          de: "Kapazitatserweiterungs-Paket"
          fr: "Pack d'augmentation de capacite"
          es: "Paquete de aumento de capacidad"
          it: "Pacchetto Boost di Capacita"
          nl: "Capaciteitsboost-pakket"
          da: "Kapacitetsboost-pakke"
          sv: "Kapacitetsboost-paket"
        pricing:
          en: "€3,000/month"
          de: "3.000 €/Monat"
          fr: "3 000 €/mois"
          es: "€3.000/mes"
          it: "€3.000/mese"
          nl: "€3.000/maand"
          da: "€3.000/maned"
          sv: "€3 000/manad"
        short_description:
          en: "Increase your support capacity by up to 4 additional developers or applications. Ideal for clients who outgrow the Foundation Plan's limit. You can book this package multiple times to scale as needed."
          de: "Erhohen Sie Ihre Support-Kapazitat um bis zu 4 zusatzliche Entwickler oder Anwendungen. Ideal fur Kunden, die uber das Limit des Foundation Plans hinauswachsen. Sie konnen dieses Paket mehrfach buchen."
          fr: "Augmentez votre capacite de support jusqu'a 4 developpeurs ou applications supplementaires. Ideal pour les clients qui depassent la limite du Plan Foundation. Vous pouvez reserver ce pack plusieurs fois."
          es: "Aumente su capacidad de soporte en hasta 4 desarrolladores o aplicaciones adicionales. Ideal para clientes que superan el limite del Plan Foundation. Puede reservar este paquete varias veces."
          it: "Aumenta la tua capacita di supporto fino a 4 sviluppatori o applicazioni aggiuntive. Ideale per clienti che superano il limite del Piano Foundation. Puoi prenotare questo pacchetto piu volte."
          nl: "Verhoog uw supportcapaciteit met maximaal 4 extra ontwikkelaars of applicaties. Ideaal voor klanten die de limiet van het Foundation Plan overschrijden. U kunt dit pakket meerdere keren boeken."
          da: "Og din supportkapacitet med op til 4 ekstra udviklere eller applikationer. Ideel for kunder, der vokser ud af Foundation Plan-graensen. Du kan booke denne pakke flere gange."
          sv: "Oka din supportkapacitet med upp till 4 ytterligare utvecklare eller applikationer. Idealiskt for kunder som vaxer ur Foundation Plan-gransen. Du kan boka detta paket flera ganger."
        detailed_description:
          en: "Increase your support capacity by up to 4 additional developers or apps (or deployments/applications/services etc.). This package is ideal for clients who outgrow the Foundation Plan's limit of 8 developers or 8 applications. You can book this package multiple times to scale your support as needed. If you have a microservice architecture the number of apps will not be 4 but 8."
          de: "Erhohen Sie Ihre Support-Kapazitat um bis zu 4 zusatzliche Entwickler oder Anwendungen. Dieses Paket ist ideal fur Kunden, die uber das Limit des Foundation Plans von 8 Entwicklern oder 8 Anwendungen hinauswachsen. Sie konnen dieses Paket mehrfach buchen, um Ihren Support nach Bedarf zu skalieren."
          fr: "Augmentez votre capacite de support jusqu'a 4 developpeurs ou applications supplementaires. Ce pack est ideal pour les clients qui depassent la limite du Plan Foundation de 8 developpeurs ou 8 applications. Vous pouvez reserver ce pack plusieurs fois pour adapter votre support selon vos besoins."
          es: "Aumente su capacidad de soporte en hasta 4 desarrolladores o aplicaciones adicionales. Este paquete es ideal para clientes que superan el limite del Plan Foundation de 8 desarrolladores o 8 aplicaciones. Puede reservar este paquete varias veces para escalar su soporte segun sea necesario."
          it: "Aumenta la tua capacita di supporto fino a 4 sviluppatori o applicazioni aggiuntive. Questo pacchetto e ideale per clienti che superano il limite del Piano Foundation di 8 sviluppatori o 8 applicazioni. Puoi prenotare questo pacchetto piu volte per scalare il tuo supporto secondo necessita."
          nl: "Verhoog uw supportcapaciteit met maximaal 4 extra ontwikkelaars of applicaties. Dit pakket is ideaal voor klanten die de limiet van het Foundation Plan van 8 ontwikkelaars of 8 applicaties overschrijden. U kunt dit pakket meerdere keren boeken om uw support naar behoefte te schalen."
          da: "Og din supportkapacitet med op til 4 ekstra udviklere eller applikationer. Denne pakke er ideel for kunder, der vokser ud af Foundation Plans graense pa 8 udviklere eller 8 applikationer. Du kan booke denne pakke flere gange for at skalere din support efter behov."
          sv: "Oka din supportkapacitet med upp till 4 ytterligare utvecklare eller applikationer. Detta paket ar idealiskt for kunder som vaxer ur Foundation Plans grans pa 8 utvecklare eller 8 applikationer. Du kan boka detta paket flera ganger for att skala din support efter behov."

      upgrade_support:
        label:
          en: "Upgrade Support Package"
          de: "Upgrade-Support-Paket"
          fr: "Pack de support de mise a niveau"
          es: "Paquete de soporte de actualizacion"
          it: "Pacchetto Supporto Upgrade"
          nl: "Upgrade Support-pakket"
          da: "Opgraderingssupport-pakke"
          sv: "Uppgraderingssupport-paket"
        pricing:
          en: "1 hour for 100€"
          de: "1 Stunde fur 100€"
          fr: "Pack de 10 heures a 100 €/heure"
          es: "Paquete de 10 horas a €100/hora"
          it: "Pacchetto 10 ore a €100/ora"
          nl: "10-urenpakket voor €100/uur"
          da: "10-timers pakke til €100/time"
          sv: "10-timmarspaket for €100/timme"
        short_description:
          en: "Must be scheduled at least 2 months in advance. Standard hours Mon–Fri 09:00–17:00"
          de: "Muss mindestens 2 Monate im Voraus geplant werden. Standardzeiten Mo-Fr 09:00-17:00."
          fr: "Reservation minimum de 10 heures par pack. Doit etre planifie au moins 2 mois a l'avance. Horaires standard lun-ven 09:00-17:00. Les heures de week-end ou en dehors sont facturees a 250 €/heure."
          es: "Reserva minima de 10 horas por paquete. Debe programarse con al menos 2 meses de anticipacion. Horario estandar lun-vie 09:00-17:00. Horas de fin de semana o fuera de horario se cobran a €250/hora."
          it: "Prenotazione minima di 10 ore per pacchetto. Deve essere pianificato con almeno 2 mesi di anticipo. Orari standard lun-ven 09:00-17:00. Ore weekend o fuori orario addebitate a €250/ora."
          nl: "Minimale boeking van 10 uur per pakket. Moet minimaal 2 maanden van tevoren worden gepland. Standaarduren ma-vr 09:00-17:00. Weekend- of buitenuren worden gefactureerd tegen €250/uur."
          da: "Minimum booking pa 10 timer pr. pakke. Skal planlaegges mindst 2 maneder i forvejen. Standardtimer man-fre 09:00-17:00. Weekend- eller efter-timer faktureres til €250/time."
          sv: "Minimumbokning pa 10 timmar per paket. Maste planeras minst 2 manader i forvag. Standardtimmar man-fre 09:00-17:00. Helg- eller utanfor-timmar debiteras €250/timme."
        detailed_description:
          en: "Must be scheduled at least 2 months in advance to ensure resource availability and can be booked multiple times for ongoing support needs. KumoOps reserves the right to decline bookings based on resource availability or scope alignment. Standard support hours are Monday to Friday, 09:00-17:00. If support is required outside of these hours, it must be coordinated and agreed upon with the KumoOps team in advance; a special agreement may be required."
          de: "Muss mindestens 2 Monate im Voraus geplant werden, um die Ressourcenverfugbarkeit zu gewahrleisten, und kann mehrfach gebucht werden. KumoOps behalt sich das Recht vor, Buchungen basierend auf Ressourcenverfugbarkeit oder Umfangsabstimmung abzulehnen. Standard-Support-Zeiten sind Montag bis Freitag, 09:00-17:00 Uhr. Support ausserhalb dieser Zeiten muss im Voraus koordiniert werden; eine Sondervereinbarung kann erforderlich sein."
          fr: "Reservation minimum de 10 heures par demande de pack (1 heure coute 100 €). Doit etre planifie au moins 2 mois a l'avance pour garantir la disponibilite des ressources et peut etre reserve plusieurs fois. KumoOps se reserve le droit de refuser des reservations en fonction de la disponibilite des ressources ou de l'alignement du perimetre. Les heures de support standard sont du lundi au vendredi, 09:00-17:00. Le support en dehors de ces heures doit etre coordonne et convenu avec l'equipe KumoOps a l'avance ; un accord special peut etre requis. Les heures de temps et materiaux le week-end, les jours feries nationaux ou en dehors des heures de support standard seront facturees a 250 € par heure."
          es: "Reserva minima de 10 horas por solicitud de paquete (1 hora cuesta €100). Debe programarse con al menos 2 meses de anticipacion para garantizar la disponibilidad de recursos y puede reservarse varias veces. KumoOps se reserva el derecho de rechazar reservas segun la disponibilidad de recursos o la alineacion del alcance. El horario de soporte estandar es de lunes a viernes, 09:00-17:00. El soporte fuera de estas horas debe coordinarse y acordarse con el equipo de KumoOps con anticipacion; puede requerirse un acuerdo especial. Las horas de tiempo y materiales en fines de semana, dias festivos nacionales o fuera del horario de soporte estandar se cobraran a €250 por hora."
          it: "Prenotazione minima di 10 ore per richiesta di pacchetto (1 ora costa €100). Deve essere pianificato con almeno 2 mesi di anticipo per garantire la disponibilita delle risorse e puo essere prenotato piu volte. KumoOps si riserva il diritto di rifiutare prenotazioni in base alla disponibilita delle risorse o all'allineamento dell'ambito. Gli orari di supporto standard sono dal lunedi al venerdi, 09:00-17:00. Il supporto al di fuori di questi orari deve essere coordinato e concordato con il team KumoOps in anticipo; potrebbe essere richiesto un accordo speciale. Le ore time & material nei fine settimana, festivita nazionali o al di fuori degli orari di supporto standard saranno addebitate a €250 l'ora."
          nl: "Minimale boeking van 10 uur per pakketaanvraag (1 uur kost €100). Moet minimaal 2 maanden van tevoren worden gepland om beschikbaarheid van resources te garanderen en kan meerdere keren worden geboekt. KumoOps behoudt zich het recht voor om boekingen te weigeren op basis van beschikbaarheid van resources of scope-afstemming. Standaard supporturen zijn maandag tot vrijdag, 09:00-17:00. Support buiten deze uren moet van tevoren worden gecoordineerd en overeengekomen met het KumoOps-team; een speciale overeenkomst kan vereist zijn. Time & material uren in weekenden, nationale feestdagen of buiten standaard supporturen worden gefactureerd tegen €250 per uur."
          da: "Minimum booking pa 10 timer pr. pakkeforesporgsel (1 time koster €100). Skal planlaegges mindst 2 maneder i forvejen for at sikre ressourcetilgaengelighed og kan bookes flere gange. KumoOps forbeholder sig retten til at afvise bookinger baseret pa ressourcetilgaengelighed eller scope-tilpasning. Standard supporttimer er mandag til fredag, 09:00-17:00. Support uden for disse timer skal koordineres og aftales med KumoOps-teamet pa forhand; en saerlig aftale kan vaere pakraevet. Time & material timer i weekender, helligdage eller uden for standard supporttimer faktureres til €250 pr. time."
          sv: "Minimumbokning pa 10 timmar per paketforfragan (1 timme kostar €100). Maste planeras minst 2 manader i forvag for att sakerstalla resurstillganglighet och kan bokas flera ganger. KumoOps forbehaller sig ratten att neka bokningar baserat pa resurstillganglighet eller scope-anpassning. Standard supporttimmar ar mandag till fredag, 09:00-17:00. Support utanfor dessa timmar maste koordineras och avtalas med KumoOps-teamet i forvag; ett sarskilt avtal kan kravas. Time & material timmar pa helger, helgdagar eller utanfor standard supporttimmar debiteras €250 per timme."

      managed_databases:
        label:
          en: "Additional Managed Databases as a Service"
          de: "Managed Databases as a Service"
          fr: "Bases de donnees gerees en tant que service"
          es: "Bases de datos gestionadas como servicio"
          it: "Database Gestiti come Servizio"
          nl: "Managed Databases as a Service"
          da: "Managed Databases as a Service"
          sv: "Managed Databases as a Service"
        pricing:
          en: "€200/month"
          de: "200 €/Monat"
          fr: "200 €/mois"
          es: "€200/mes"
          it: "€200/mese"
          nl: "€200/maand"
          da: "€200/maned"
          sv: "€200/manad"
        short_description:
          en: "Fully managed database services including provisioning, automated backups, scaling, and continuous monitoring. Also covers schema creation, databases, and user accounts."
          de: "Vollstandig verwaltete Datenbankdienste einschliesslich Bereitstellung, automatischer Backups, Skalierung und kontinuierlicher Uberwachung. Umfasst auch Schema-Erstellung, Datenbanken und Benutzerkonten."
          fr: "Services de bases de donnees entierement geres comprenant le provisionnement, les sauvegardes automatisees, la mise a l'echelle et la surveillance continue. Couvre egalement la creation de schemas, de bases de donnees et de comptes utilisateurs."
          es: "Servicios de bases de datos totalmente gestionados que incluyen aprovisionamiento, copias de seguridad automatizadas, escalado y monitoreo continuo. Tambien cubre la creacion de esquemas, bases de datos y cuentas de usuario."
          it: "Servizi di database completamente gestiti inclusi provisioning, backup automatici, scaling e monitoraggio continuo. Copre anche la creazione di schemi, database e account utente."
          nl: "Volledig beheerde databasediensten inclusief provisioning, geautomatiseerde back-ups, schaling en continue monitoring. Omvat ook het aanmaken van schema's, databases en gebruikersaccounts."
          da: "Fuldt administrerede databasetjenester inkl. provisionering, automatiske backups, skalering og kontinuerlig overvagning. Daekker ogsa oprettelse af skemaer, databaser og brugerkonti."
          sv: "Fullt hanterade databastjanster inklusive provisionering, automatiska sakerhetskopior, skalning och kontinuerlig overvakning. Tacker aven schemaskapande, databaser och anvandarkonton."
        detailed_description:
          en: "Fully managed database services including provisioning, automated backups, scaling, and continuous monitoring to ensure availability, security, and optimal performance of your databases. Additionally, this service covers the creation of database schemas, databases, and user accounts, providing a comprehensive solution for your database needs. For each additional stage addon another database addon needs to be booked."
          de: "Vollstandig verwaltete Datenbankdienste einschliesslich Bereitstellung, automatischer Backups, Skalierung und kontinuierlicher Uberwachung, um Verfugbarkeit, Sicherheit und optimale Leistung Ihrer Datenbanken zu gewahrleisten. Zusatzlich umfasst dieser Service die Erstellung von Datenbank-Schemas, Datenbanken und Benutzerkonten und bietet eine umfassende Losung fur Ihre Datenbankanforderungen."
          fr: "Services de bases de donnees entierement geres comprenant le provisionnement, les sauvegardes automatisees, la mise a l'echelle et la surveillance continue pour garantir la disponibilite, la securite et les performances optimales de vos bases de donnees. De plus, ce service couvre la creation de schemas de bases de donnees, de bases de donnees et de comptes utilisateurs, fournissant une solution complete pour vos besoins en bases de donnees."
          es: "Servicios de bases de datos totalmente gestionados que incluyen aprovisionamiento, copias de seguridad automatizadas, escalado y monitoreo continuo para garantizar la disponibilidad, seguridad y rendimiento optimo de sus bases de datos. Ademas, este servicio cubre la creacion de esquemas de bases de datos, bases de datos y cuentas de usuario, proporcionando una solucion integral para sus necesidades de bases de datos."
          it: "Servizi di database completamente gestiti inclusi provisioning, backup automatici, scaling e monitoraggio continuo per garantire disponibilita, sicurezza e prestazioni ottimali dei tuoi database. Inoltre, questo servizio copre la creazione di schemi di database, database e account utente, fornendo una soluzione completa per le tue esigenze di database."
          nl: "Volledig beheerde databasediensten inclusief provisioning, geautomatiseerde back-ups, schaling en continue monitoring om beschikbaarheid, beveiliging en optimale prestaties van uw databases te garanderen. Daarnaast omvat deze service het aanmaken van databaseschema's, databases en gebruikersaccounts, wat een uitgebreide oplossing biedt voor uw databasebehoeften."
          da: "Fuldt administrerede databasetjenester inkl. provisionering, automatiske backups, skalering og kontinuerlig overvagning for at sikre tilgaengelighed, sikkerhed og optimal ydeevne af dine databaser. Derudover daekker denne service oprettelse af databaseskemaer, databaser og brugerkonti, hvilket giver en omfattende losning til dine databasebehov."
          sv: "Fullt hanterade databastjanster inklusive provisionering, automatiska sakerhetskopior, skalning och kontinuerlig overvakning for att sakerstalla tillganglighet, sakerhet och optimal prestanda for dina databaser. Dessutom tacker denna tjanst skapande av databasscheman, databaser och anvandarkonton, vilket ger en heltackande losning for dina databasbehov."

      git_hosting:
        label:
          en: "Git Hosting as a Service"
          de: "Git Hosting as a Service"
          fr: "Hebergement Git en tant que service"
          es: "Alojamiento Git como servicio"
          it: "Git Hosting come Servizio"
          nl: "Git Hosting as a Service"
          da: "Git Hosting as a Service"
          sv: "Git Hosting as a Service"
        pricing:
          en: "€300"
          de: "300 €/Monat"
          fr: "300 €/mois"
          es: "€300/mes"
          it: "€300/mese"
          nl: "€300/maand"
          da: "€300/maned"
          sv: "€300/manad"
        short_description:
          en: "Managed Git hosting and administration as a SaaS solution. We handle configuration, maintenance, updates, and support. Hosted in Germany."
          de: "Verwaltetes Git-Hosting und -Administration als SaaS-Losung. Wir ubernehmen Konfiguration, Wartung, Updates und Support. Gehostet in Deutschland."
          fr: "Hebergement et administration Git geres en tant que solution SaaS. Nous gerons la configuration, la maintenance, les mises a jour et le support. Heberge en Allemagne."
          es: "Alojamiento y administracion de Git gestionados como solucion SaaS. Nos encargamos de la configuracion, mantenimiento, actualizaciones y soporte. Alojado en Alemania."
          it: "Hosting e amministrazione Git gestiti come soluzione SaaS. Gestiamo configurazione, manutenzione, aggiornamenti e supporto. Ospitato in Germania."
          nl: "Beheerde Git-hosting en -administratie als SaaS-oplossing. Wij verzorgen configuratie, onderhoud, updates en support. Gehost in Duitsland."
          da: "Administreret Git-hosting og -administration som SaaS-losning. Vi handterer konfiguration, vedligeholdelse, opdateringer og support. Hostet i Tyskland."
          sv: "Hanterad Git-hosting och -administration som SaaS-losning. Vi hanterar konfiguration, underhall, uppdateringar och support. Hostat i Tyskland."
        detailed_description:
          en: "KumoOps Git as a Service provides managed Git hosting and administration as a SaaS solution. Your team or company will receive a dedicated space within the Git environment, while our team handles configuration, routine maintenance, updates, and user support. The service is hosted in the OpenTelekomCloud in Germany, ensuring compliance with local data privacy regulations and standards. If the customer is not providing a Git service this package should be included"
          de: "KumoOps Git as a Service bietet verwaltetes Git-Hosting und -Administration als SaaS-Losung. Ihr Team oder Unternehmen erhalt einen dedizierten Bereich innerhalb der Git-Umgebung, wahrend unser Team Konfiguration, routinemassige Wartung, Updates und Benutzer-Support ubernimmt. Der Service wird in der OpenTelekomCloud in Deutschland gehostet und gewahrleistet die Einhaltung lokaler Datenschutzvorschriften und -standards."
          fr: "KumoOps Git as a Service fournit un hebergement et une administration Git geres en tant que solution SaaS. Votre equipe ou entreprise recevra un espace dedie au sein de l'environnement Git, tandis que notre equipe gere la configuration, la maintenance de routine, les mises a jour et le support utilisateur. Le service est heberge dans OpenTelekomCloud en Allemagne, garantissant la conformite aux reglementations et normes locales de confidentialite des donnees."
          es: "KumoOps Git as a Service proporciona alojamiento y administracion de Git gestionados como solucion SaaS. Su equipo o empresa recibira un espacio dedicado dentro del entorno Git, mientras que nuestro equipo se encarga de la configuracion, el mantenimiento rutinario, las actualizaciones y el soporte al usuario. El servicio esta alojado en OpenTelekomCloud en Alemania, garantizando el cumplimiento de las regulaciones y estandares de privacidad de datos locales."
          it: "KumoOps Git as a Service fornisce hosting e amministrazione Git gestiti come soluzione SaaS. Il tuo team o azienda ricevera uno spazio dedicato all'interno dell'ambiente Git, mentre il nostro team gestisce configurazione, manutenzione di routine, aggiornamenti e supporto utenti. Il servizio e ospitato in OpenTelekomCloud in Germania, garantendo la conformita alle normative e agli standard locali sulla privacy dei dati."
          nl: "KumoOps Git as a Service biedt beheerde Git-hosting en -administratie als SaaS-oplossing. Uw team of bedrijf ontvangt een toegewezen ruimte binnen de Git-omgeving, terwijl ons team de configuratie, routineonderhoud, updates en gebruikersondersteuning verzorgt. De service wordt gehost in OpenTelekomCloud in Duitsland, wat naleving van lokale privacyregelgeving en -standaarden garandeert."
          da: "KumoOps Git as a Service tilbyder administreret Git-hosting og -administration som SaaS-losning. Dit team eller firma vil modtage et dedikeret rum inden for Git-miljoet, mens vores team handterer konfiguration, rutinemassig vedligeholdelse, opdateringer og brugersupport. Servicen er hostet i OpenTelekomCloud i Tyskland, hvilket sikrer overholdelse af lokale databeskyttelsesforskrifter og -standarder."
          sv: "KumoOps Git as a Service erbjuder hanterad Git-hosting och -administration som SaaS-losning. Ditt team eller foretag kommer att fa ett dedikerat utrymme inom Git-miljon, medan vart team hanterar konfiguration, rutinunderhall, uppdateringar och anvandarsupport. Tjansten ar hostad i OpenTelekomCloud i Tyskland, vilket sakerstaller efterlevnad av lokala dataskyddsforeskrifter och -standarder."

