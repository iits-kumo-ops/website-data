        short_description:
          en: "RBAC setup for secure and segmented kubectl access within Kubernetes namespaces."
          de: "RBAC-Setup fur sicheren und segmentierten kubectl-Zugriff innerhalb von Kubernetes-Namespaces."
          fr: "Configuration RBAC pour un acces kubectl securise et segmente au sein des namespaces Kubernetes."
          es: "Configuracion RBAC para acceso kubectl seguro y segmentado dentro de los namespaces de Kubernetes."
          it: "Setup RBAC per accesso kubectl sicuro e segmentato all'interno dei namespace Kubernetes."
          nl: "RBAC-setup voor beveiligde en gesegmenteerde kubectl-toegang binnen Kubernetes-namespaces."
          da: "RBAC-setup for sikker og segmenteret kubectl-adgang inden for Kubernetes-namespaces."
          sv: "RBAC-setup for saker och segmenterad kubectl-atkomst inom Kubernetes-namespaces."
        detailed_description:
          en: "Setup and maintenance of Role-Based Access Control (RBAC) enabling secure and segmented kubectl access for developers within dedicated namespaces in your Kubernetes cluster, enhancing security and operational independence."
          de: "Setup und Wartung von Role-Based Access Control (RBAC), das sicheren und segmentierten kubectl-Zugriff fur Entwickler innerhalb dedizierter Namespaces in Ihrem Kubernetes-Cluster ermoglicht und so Sicherheit und betriebliche Unabhangigkeit verbessert."
          fr: "Configuration et maintenance du controle d'acces base sur les roles (RBAC) permettant un acces kubectl securise et segmente pour les developpeurs au sein de namespaces dedies dans votre cluster Kubernetes, ameliorant la securite et l'independance operationnelle."
          es: "Configuracion y mantenimiento de Control de Acceso Basado en Roles (RBAC) que permite acceso kubectl seguro y segmentado para desarrolladores dentro de namespaces dedicados en su cluster de Kubernetes, mejorando la seguridad y la independencia operativa."
          it: "Setup e manutenzione del Role-Based Access Control (RBAC) che consente accesso kubectl sicuro e segmentato per gli sviluppatori all'interno di namespace dedicati nel tuo cluster Kubernetes, migliorando sicurezza e indipendenza operativa."
          nl: "Setup en onderhoud van Role-Based Access Control (RBAC) die beveiligde en gesegmenteerde kubectl-toegang mogelijk maakt voor ontwikkelaars binnen toegewijde namespaces in uw Kubernetes-cluster, wat beveiliging en operationele onafhankelijkheid verbetert."
          da: "Setup og vedligeholdelse af Role-Based Access Control (RBAC), der muliggor sikker og segmenteret kubectl-adgang for udviklere inden for dedikerede namespaces i din Kubernetes-klynge, hvilket forbedrer sikkerhed og operationel uafhaengighed."
          sv: "Setup och underhall av Role-Based Access Control (RBAC) som mojliggor saker och segmenterad kubectl-atkomst for utvecklare inom dedikerade namespaces i ditt Kubernetes-kluster, vilket forbattrar sakerhet och operativt oberoende."

