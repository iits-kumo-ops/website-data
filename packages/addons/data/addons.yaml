  security:
    label:
      en: "Security"
      de: "Sicherheit"
      fr: "Securite"
      es: "Seguridad"
      it: "Sicurezza"
      nl: "Beveiliging"
      da: "Sikkerhed"
      sv: "Sakerhet"
    items:
      c5_testified:
        label:
          en: "C5 Testification (Application + KumoOps Support & Operations Processes)"
          de: "C5-Testifizierung (Applikation + KumoOps Support- & Betriebsprozesse)"
          fr: "Attestation C5 (Application + processus de support et d’exploitation KumoOps)"
          es: "Certificación C5 (Aplicación + procesos de soporte y operaciones de KumoOps)"
          it: "Attestazione C5 (Applicazione + processi di supporto e operazioni KumoOps)"
          nl: "C5-attestatie (Applicatie + KumoOps support- en operationele processen)"
          da: "C5-attestering (Applikation + KumoOps support- og driftsprocesser)"
          sv: "C5-attestering (Applikation + KumoOps support- och driftprocesser)"
        pricing:
          en: "€1,000/month"
          de: "1.000 €/Monat"
          fr: "1 000 €/mois"
          es: "1.000 €/mes"
          it: "€1.000/mese"
          nl: "€1.000/maand"
          da: "€1.000/maned"
          sv: "€1.000/manad"
        short_description:
          en: "Prepare and include your application in a C5 (incl. alignment with ISO 27001 controls where applicable)) testification scope via KumoOps processes and our audit partner."
          de: "Vorbereitung und Aufnahme Ihrer Applikation in einen C5-Testifizierungsumfang (inkl. Abgleich mit ISO-27001-Kontrollen, sofern anwendbar) über KumoOps-Prozesse und unseren Audit-Partner."
          fr: "Preparation et inclusion de votre application dans un perimetre d’attestation C5 (y compris l’alignement avec les controles ISO 27001 le cas echeant) via les processus KumoOps et notre partenaire d’audit."
          es: "Preparacion e inclusion de su aplicacion en el alcance de certificacion C5 (incl. alineacion con controles ISO 27001 cuando aplique) mediante procesos de KumoOps y nuestro socio auditor."
          it: "Preparazione e inclusione della tua applicazione nell’ambito di attestazione C5 (incl. allineamento ai controlli ISO 27001 ove applicabile) tramite i processi KumoOps e il nostro partner di audit."
          nl: "Voorbereiding en opname van uw applicatie in een C5-attestatie-scope (incl. afstemming op ISO 27001-controls waar van toepassing) via KumoOps-processen en onze auditpartner."
          da: "Forberedelse og inkludering af din applikation i et C5-attesteringsomfang (inkl. afstemning med ISO 27001-kontroller hvor relevant) via KumoOps-processer og vores auditpartner."
          sv: "Forberedelse och inkludering av din applikation i en C5-attesteringsomfattning (inkl. anpassning till ISO 27001-kontroller där tillämpligt) via KumoOps-processer och vår auditpartner."
        detailed_description:
          en: "If KumoOps is already C5-testified, we can onboard your application into a C5-aligned testification scope. Together we define (typically quarterly) which application(s) are included, prepare the required evidence and documentation, and coordinate the testification process with our audit/testification partner (who also testifies KumoOps). This add-on covers planning, evidence collection support, process alignment, and audit coordination. Final testification is issued by the independent auditor and depends on meeting all C5 requirements."
          de: "Wenn KumoOps bereits C5-testifiziert ist, können wir Ihre Applikation in einen C5-ausgerichteten Testifizierungsumfang aufnehmen. Gemeinsam definieren wir (typischerweise quartalsweise), welche Applikation(en) enthalten sind, bereiten die erforderlichen Nachweise und Dokumentationen vor und koordinieren den Testifizierungsprozess mit unserem Audit-/Testifizierungspartner (der auch KumoOps testifiziert). Dieses Add-on umfasst Planung, Unterstützung bei der Evidenzsammlung, Prozessabgleich und Audit-Koordination. Die finale Testifizierung wird vom unabhängigen Auditor ausgestellt und setzt die Erfüllung aller C5-Anforderungen voraus."
          fr: "Si KumoOps est deja atteste C5, nous pouvons integrer votre application dans un perimetre d’attestation aligne C5. Ensemble, nous definissons (generalement chaque trimestre) quelles applications sont incluses, preparons les preuves et la documentation requises et coordonnons le processus d’attestation avec notre partenaire d’audit/d’attestation (qui atteste egalement KumoOps). Cet add-on couvre la planification, le support a la collecte des preuves, l’alignement des processus et la coordination d'audit. L’attestation finale est delivree par l’auditeur independant et depend du respect de toutes les exigences C5."
          es: "Si KumoOps ya cuenta con certificacion C5, podemos incorporar su aplicacion a un alcance de certificacion alineado con C5. Juntos definimos (normalmente de forma trimestral) que aplicacion(es) se incluyen, preparamos las evidencias y la documentacion necesarias y coordinamos el proceso con nuestro socio de auditoria/certificacion (que tambien certifica a KumoOps). Este add-on cubre la planificacion, el soporte para la recopilacion de evidencias, la alineacion de procesos y la coordinacion de la auditoria. La certificacion final la emite el auditor independiente y depende del cumplimiento de todos los requisitos C5."
          it: "Se KumoOps e gia attestata C5, possiamo integrare la tua applicazione in un ambito di attestazione allineato a C5. Insieme definiamo (tipicamente su base trimestrale) quali applicazioni sono incluse, prepariamo le evidenze e la documentazione necessarie e coordiniamo il processo di attestazione con il nostro partner di audit/attestazione (che attesta anche KumoOps). Questo add-on copre la pianificazione, il supporto alla raccolta delle evidenze, l’allineamento dei processi e il coordinamento dell’audit. L’attestazione finale viene rilasciata dall’auditor indipendente e dipende dal soddisfacimento di tutti i requisiti C5."
          nl: "Als KumoOps al C5-geattesteerd is, kunnen we uw applicatie onboarden in een C5-uitgelijnde attestatie-scope. Samen bepalen we (meestal per kwartaal) welke applicatie(s) worden opgenomen, bereiden we de benodigde bewijslast en documentatie voor en coordineren we het attestatieproces met onze audit-/attestatiepartner (die ook KumoOps attesteert). Deze add-on omvat planning, ondersteuning bij het verzamelen van bewijs, procesafstemming en auditcoordinatie. De uiteindelijke attestatie wordt afgegeven door de onafhankelijke auditor en is afhankelijk van het voldoen aan alle C5-eisen."
          da: "Hvis KumoOps allerede er C5-attesteret, kan vi onboarde din applikation i et C5-tilpasset attesteringsomfang. Sammen fastlaegger vi (typisk kvartalsvist), hvilke applikationer der indgar, forbereder den kraevede evidens og dokumentation og koordinerer attesteringsprocessen med vores audit-/attesteringspartner (som ogsa attesterer KumoOps). Dette add-on daekker planlaegning, support til evidensindsamling, procesafstemning og auditkoordinering. Den endelige attestering udstedes af den uafhaengige auditor og afhaenger af, at alle C5-krav opfyldes."
          sv: "Om KumoOps redan ar C5-attesterat kan vi onboarda din applikation i en C5-anpassad attesteringsomfattning. Tillsammans definierar vi (vanligtvis kvartalsvis) vilka applikationer som ingar, forbereder kravd evidens och dokumentation samt koordinerar attesteringsprocessen med var audit-/attesteringspartner (som aven attesterar KumoOps). Detta add-on omfattar planering, stod for insamling av evidens, processanpassning och auditkoordinering. Slutlig attestering utfardas av oberoende revisor och forutsatter att alla C5-krav uppfylls."

      vpn_ipsec:
        label:
          en: "VPN Setup Site-to-Site IPSEC"
          de: "VPN Setup Site-to-Site IPSEC"
          fr: "Configuration VPN Site-to-Site IPSEC"
          es: "Configuracion VPN Site-to-Site IPSEC"
          it: "Setup VPN Site-to-Site IPSEC"
          nl: "VPN Setup Site-to-Site IPSEC"
          da: "VPN Setup Site-to-Site IPSEC"
          sv: "VPN Setup Site-to-Site IPSEC"
        pricing:
          en: "€300/month per VPN connection"
          de: "300 €/Monat pro VPN-Verbindung"
          fr: "300 €/mois par connexion VPN"
          es: "€300/mes por conexion VPN"
          it: "€300/mese per connessione VPN"
          nl: "€300/maand per VPN-verbinding"
          da: "€300/maned pr. VPN-forbindelse"
          sv: "€300/manad per VPN-anslutning"
        short_description:
          en: "Implementation and ongoing support of a secure VPN for encrypted communication between your cloud environment and external access points. Includes subnetwork configuration and private DNS management."
          de: "Implementierung und laufende Unterstutzung eines sicheren VPN fur verschlusselte Kommunikation zwischen Ihrer Cloud-Umgebung und externen Zugangspunkten. Einschliesslich Subnetzkonfiguration und privatem DNS-Management."
          fr: "Mise en oeuvre et support continu d'un VPN securise pour une communication chiffree entre votre environnement cloud et les points d'acces externes. Inclut la configuration des sous-reseaux et la gestion DNS privee."
          es: "Implementacion y soporte continuo de una VPN segura para comunicacion cifrada entre su entorno en la nube y puntos de acceso externos. Incluye configuracion de subredes y gestion de DNS privado."
          it: "Implementazione e supporto continuo di una VPN sicura per comunicazioni crittografate tra il tuo ambiente cloud e i punti di accesso esterni. Include configurazione delle sottoreti e gestione DNS privato."
          nl: "Implementatie en doorlopende ondersteuning van een beveiligde VPN voor versleutelde communicatie tussen uw cloudomgeving en externe toegangspunten. Inclusief subnetwerkconfiguratie en prive DNS-beheer."
          da: "Implementering og lobende support af en sikker VPN til krypteret kommunikation mellem dit cloud-miljo og eksterne adgangspunkter. Inkl. subnetvaerkskonfiguration og privat DNS-administration."
          sv: "Implementering och lopande support av en saker VPN for krypterad kommunikation mellan din molnmiljo och externa atkomstpunkter. Inkluderar subnattkonfiguration och privat DNS-hantering."
        detailed_description:
          en: "Implementation and ongoing support of a secure site-to-site IPSEC VPN to ensure encrypted and private communication between your cloud environment and external access points. This upgrade is critical for secure remote access and data protection. Our Networking Management Add-On delivers comprehensive support for your network infrastructure, including subnetwork configuration and private DNS management. The KumoOps team ensures that your network components are configured according to security best practices while maintaining high performance and reliability. Our team takes care of the initial setup, continuous monitoring, routine maintenance, and proactive updates, allowing you to focus on your core business."
          de: "Implementierung und laufende Unterstutzung eines sicheren Site-to-Site IPSEC VPN, um verschlusselte und private Kommunikation zwischen Ihrer Cloud-Umgebung und externen Zugangspunkten zu gewahrleisten. Dieses Upgrade ist kritisch fur sicheren Remote-Zugang und Datenschutz. Unser Networking Management Add-On liefert umfassende Unterstutzung fur Ihre Netzwerkinfrastruktur, einschliesslich Subnetzkonfiguration und privatem DNS-Management. Das KumoOps-Team stellt sicher, dass Ihre Netzwerkkomponenten gemass Sicherheits-Best-Practices konfiguriert sind, wahrend hohe Leistung und Zuverlassigkeit aufrechterhalten werden."
          fr: "Mise en oeuvre et support continu d'un VPN IPSEC site-to-site securise pour garantir une communication chiffree et privee entre votre environnement cloud et les points d'acces externes. Cette mise a niveau est essentielle pour un acces distant securise et la protection des donnees. Notre Add-On de gestion reseau fournit un support complet pour votre infrastructure reseau, y compris la configuration des sous-reseaux et la gestion DNS privee. L'equipe KumoOps s'assure que vos composants reseau sont configures selon les meilleures pratiques de securite tout en maintenant des performances et une fiabilite elevees."
          es: "Implementacion y soporte continuo de una VPN site-to-site IPSEC segura para garantizar una comunicacion cifrada y privada entre su entorno en la nube y puntos de acceso externos. Esta actualizacion es critica para el acceso remoto seguro y la proteccion de datos. Nuestro Add-On de Gestion de Redes proporciona soporte integral para su infraestructura de red, incluyendo configuracion de subredes y gestion de DNS privado. El equipo de KumoOps asegura que sus componentes de red esten configurados segun las mejores practicas de seguridad mientras mantiene un alto rendimiento y confiabilidad."
          it: "Implementazione e supporto continuo di una VPN IPSEC site-to-site sicura per garantire comunicazioni crittografate e private tra il tuo ambiente cloud e i punti di accesso esterni. Questo upgrade e critico per l'accesso remoto sicuro e la protezione dei dati. Il nostro Add-On di Gestione Networking offre supporto completo per la tua infrastruttura di rete, inclusa configurazione delle sottoreti e gestione DNS privato. Il team KumoOps garantisce che i tuoi componenti di rete siano configurati secondo le migliori pratiche di sicurezza mantenendo alte prestazioni e affidabilita."
          nl: "Implementatie en doorlopende ondersteuning van een beveiligde site-to-site IPSEC VPN om versleutelde en prive communicatie tussen uw cloudomgeving en externe toegangspunten te garanderen. Deze upgrade is cruciaal voor beveiligde externe toegang en gegevensbescherming. Onze Networking Management Add-On levert uitgebreide ondersteuning voor uw netwerkinfrastructuur, inclusief subnetwerkconfiguratie en prive DNS-beheer. Het KumoOps-team zorgt ervoor dat uw netwerkcomponenten zijn geconfigureerd volgens beveiligingsbest practices terwijl hoge prestaties en betrouwbaarheid worden gehandhaafd."
          da: "Implementering og lobende support af en sikker site-to-site IPSEC VPN for at sikre krypteret og privat kommunikation mellem dit cloud-miljo og eksterne adgangspunkter. Denne opgradering er kritisk for sikker fjernadgang og databeskyttelse. Vores Networking Management Add-On leverer omfattende support til din netvaerksinfrastruktur, inkl. subnetvaerkskonfiguration og privat DNS-administration. KumoOps-teamet sikrer, at dine netvaerkskomponenter er konfigureret i henhold til sikkerhedsbestpraksis, mens hoj ydeevne og palidelighed opretholdes."
          sv: "Implementering och lopande support av en saker site-to-site IPSEC VPN for att sakerstalla krypterad och privat kommunikation mellan din molnmiljo och externa atkomstpunkter. Denna uppgradering ar kritisk for saker fjarratkomst och dataskydd. Var Networking Management Add-On levererar omfattande support for din natverksinfrastruktur, inklusive subnattkonfiguration och privat DNS-hantering. KumoOps-teamet sakerstaller att dina natverkskomponenter ar konfigurerade enligt sakerhetsrattspraxis samtidigt som hog prestanda och tillforlitlighet uppratthalls."

