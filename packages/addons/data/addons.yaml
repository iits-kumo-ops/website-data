          de: "Support fur individuelle Anforderungen ausserhalb des KumoOps Tech-Stack-Umfangs (oder wenn der Tech-Stack nach Time & Material abgerechnet wird). Ideal fur einzigartige oder projektspezifische Bedurfnisse. Wochenend-Time & Material Stunden werden mit 250 € pro Stunde berechnet und mussen im Voraus geplant werden. KumoOps behalt sich das Recht vor, Anfragen basierend auf Machbarkeit oder Ressourcenbeschrankungen abzulehnen."
          fr: "Support pour des exigences personnalisees en dehors du perimetre de la stack technologique KumoOps (ou lorsque la stack technologique est facturee en temps et materiaux). Ideal pour des besoins uniques ou specifiques au projet. Les heures de temps et materiaux du week-end sont facturees a 250 € par heure et doivent etre planifiees a l'avance. KumoOps se reserve le droit de refuser des demandes en fonction de la faisabilite ou des contraintes de ressources."
          es: "Soporte para requisitos personalizados fuera del alcance del stack tecnologico de KumoOps (o donde el stack tecnologico se factura por tiempo y materiales). Ideal para necesidades unicas o especificas del proyecto. Las horas de tiempo y materiales de fin de semana se cobran a €250 por hora y deben planificarse con anticipacion. KumoOps se reserva el derecho de rechazar solicitudes basandose en la viabilidad o las limitaciones de recursos."
          it: "Supporto per requisiti personalizzati al di fuori dell'ambito dello stack tecnologico KumoOps (o dove lo stack tecnologico e fatturato time-and-materials). Ideale per esigenze uniche o specifiche del progetto. Le ore time & material del weekend sono addebitate a €250 l'ora e devono essere pianificate in anticipo. KumoOps si riserva il diritto di rifiutare richieste in base alla fattibilita o ai vincoli di risorse."
          nl: "Support voor aangepaste vereisten buiten de scope van de KumoOps tech stack (of waar de tech stack time-and-materials wordt gefactureerd). Ideaal voor unieke of projectspecifieke behoeften. Weekend time & material uren worden gefactureerd tegen €250 per uur en moeten van tevoren worden gepland. KumoOps behoudt zich het recht voor om verzoeken te weigeren op basis van haalbaarheid of resourcebeperkingen."
          da: "Support til tilpassede krav uden for KumoOps tech stack-omfanget (eller hvor tech stacken faktureres time-and-materials). Ideel til unikke eller projektspecifikke behov. Weekend time & material timer faktureres til €250 pr. time og skal planlaegges pa forhand. KumoOps forbeholder sig retten til at afvise forespørgsler baseret pa gennemforlighed eller ressourcebegransninger."
          sv: "Support for anpassade krav utanfor KumoOps tech stack-omfattningen (eller dar tech stacken faktureras time-and-materials). Idealiskt for unika eller projektspecifika behov. Helg time & material timmar debiteras €250 per timme och maste planeras i forvag. KumoOps forbehaller sig ratten att neka forfragningar baserat pa genomforbarhet eller resursbegransningar."

