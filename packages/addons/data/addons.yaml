        detailed_description:
          en: "Setup and maintenance of Role-Based Access Control (RBAC) enabling secure and segmented kubectl access for developers within dedicated namespaces in your Kubernetes cluster, enhancing security and operational independence. RBAC will be based on Entra ID groups and users."
          de: "Setup und Wartung von Role-Based Access Control (RBAC), das sicheren und segmentierten kubectl-Zugriff fur Entwickler innerhalb dedizierter Namespaces in Ihrem Kubernetes-Cluster ermoglicht und so Sicherheit und betriebliche Unabhangigkeit verbessert. RBAC basiert auf Entra ID-Gruppen und -Benutzern."
          fr: "Configuration et maintenance du controle d'acces base sur les roles (RBAC) permettant un acces kubectl securise et segmente pour les developpeurs au sein de namespaces dedies dans votre cluster Kubernetes, ameliorant la securite et l'independance operationnelle. Le RBAC sera base sur les groupes et utilisateurs Entra ID."
          es: "Configuracion y mantenimiento de Control de Acceso Basado en Roles (RBAC) que permite acceso kubectl seguro y segmentado para desarrolladores dentro de namespaces dedicados en su cluster de Kubernetes, mejorando la seguridad y la independencia operativa. RBAC estara basado en grupos y usuarios de Entra ID."
          it: "Setup e manutenzione del Role-Based Access Control (RBAC) che consente accesso kubectl sicuro e segmentato per gli sviluppatori all'interno di namespace dedicati nel tuo cluster Kubernetes, migliorando sicurezza e indipendenza operativa. RBAC sara basato su gruppi e utenti Entra ID."
          nl: "Setup en onderhoud van Role-Based Access Control (RBAC) die beveiligde en gesegmenteerde kubectl-toegang mogelijk maakt voor ontwikkelaars binnen toegewijde namespaces in uw Kubernetes-cluster, wat beveiliging en operationele onafhankelijkheid verbetert. RBAC wordt gebaseerd op Entra ID-groepen en -gebruikers."
          da: "Setup og vedligeholdelse af Role-Based Access Control (RBAC), der muliggor sikker og segmenteret kubectl-adgang for udviklere inden for dedikerede namespaces i din Kubernetes-klynge, hvilket forbedrer sikkerhed og operationel uafhaengighed. RBAC vil vaere baseret pa Entra ID-grupper og -brugere."
          sv: "Setup och underhall av Role-Based Access Control (RBAC) som mojliggor saker och segmenterad kubectl-atkomst for utvecklare inom dedikerade namespaces i ditt Kubernetes-kluster, vilket forbattrar sakerhet och operativt oberoende. RBAC kommer att baseras pa Entra ID-grupper och -anvandare."
