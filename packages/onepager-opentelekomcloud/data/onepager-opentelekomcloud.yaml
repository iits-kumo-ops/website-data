features:
  - name: experience
    iconName: award
    title:
      en: "Proven Expertise"
      de: "Bewährte Expertise"
      da: "Dokumenteret erfaring"
    description:
      en: "We've led 100+ successful migrations to OpenTelekomCloud, from startups to platforms with millions of daily users."
      de: "Wir haben 100+ erfolgreiche Migrationen zur OpenTelekomCloud durchgeführt – von Start-ups bis zu Plattformen mit Millionen täglichen Nutzern."
      da: "Vi har gennemført 100+ succesfulde migrationer til OpenTelekomCloud – fra startups til platforme med millioner af daglige brugere."

  - name: cloudSecOps
    iconName: users
    title:
      en: "CloudSecOps as a Service"
      de: "CloudSecOps as a Service"
      da: "CloudSecOps som en service"
    description:
      en: "Not only the migration is included but you get a full CloudSecOps Team which will maintain and operate the cloud for you"
      de: "Nicht nur die Migration ist enthalten: Sie erhalten ein komplettes CloudSecOps-Team, das Ihre Cloud für Sie betreibt und weiterentwickelt."
      da: "Ikke kun migrationen er inkluderet – du får også et fuldt CloudSecOps-team, der vedligeholder og drifter din cloud."

  - name: compliance
    iconName: badge-check
    title:
      en: "Certified out of the box"
      de: "Zertifiziert out of the box"
      da: "Certificeret out of the box"
    description:
      en: "With us operations, service and infrastructure is already certified*. We can get you certified in no time"
      de: "Mit uns sind Betrieb, Service und Infrastruktur bereits zertifiziert*. Wir bringen Sie in kürzester Zeit zur Zertifizierung."
      da: "Med os er drift, service og infrastruktur allerede certificeret*. Vi kan hjælpe dig med at blive certificeret på ingen tid."

  - name: migration
    iconName: zap
    title:
      en: "Seamless Migration"
      de: "Nahtlose Migration"
      da: "Problemfri migration"
    description:
      en: "Zero-downtime migration with rollback capabilities and comprehensive testing."
      de: "Migration ohne Downtime – mit Rollback-Möglichkeiten und umfassenden Tests."
      da: "Migration uden nedetid med rollback-muligheder og omfattende test."

  - name: security
    iconName: shield-check
    title:
      en: "Enhanced Security"
      de: "Erhöhte Sicherheit"
      da: "Forbedret sikkerhed"
    description:
      en: "European CloudSecOps team and data centers with no US jurisdiction. Your data stays in the EU."
      de: "Europäisches CloudSecOps-Team und Rechenzentren ohne US-Rechtszugriff. Ihre Daten bleiben in der EU."
      da: "Europæisk CloudSecOps-team og datacentre uden amerikansk jurisdiktion. Dine data bliver i EU."

  - name: cost
    iconName: file-text
    title:
      en: "Free Migration Plan"
      de: "Kostenloser Migrationsplan"
      da: "Gratis migrationsplan"
    description:
      en: "Let our team analyze your current US cloud setup and we create a free migration roadmap for you."
      de: "Wir analysieren Ihre aktuelle US-Cloud-Umgebung und erstellen kostenlos eine Migrations-Roadmap für Sie."
      da: "Lad vores team analysere din nuværende US-cloud-opsætning, så udarbejder vi en gratis migrations-roadmap til dig."
