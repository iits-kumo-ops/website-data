    de: "100% EU-Rechtsraum — betrieben von Deutsche Telekom"
    da: "100% EU-jurisdiktion — drevet af Deutsche Telekom"

  euCloud.description:
    en: "Play it safe: migrate today to a 100% European, GDPR-compliant cloud. Operated by a german company and hosted on a EU cloud."
    de: "Gehen Sie auf Nummer sicher: Wechseln Sie jetzt in eine 100% europäische, DSGVO-konforme Cloud. Betrieben von einem deutschen Unternehmen und in der EU gehostet."
    da: "Vær på den sikre side: migrér i dag til en 100% europæisk, GDPR-kompatibel cloud. Drevet af en tysk virksomhed og hostet i EU."

