    en: "Why migrate away from US hyperscalers now?"
    de: "Warum jetzt von US-Hyperscalern weg migrieren?"
    da: "Hvorfor migrere væk fra amerikanske hyperscalere nu?"

  need.description:
    en: "The US CLOUD Act grants American authorities access to data stored by US companies — even on EU servers. Schrems II invalidated the Privacy Shield. Your compliance is at risk. OpenTelekomCloud keeps your data in German data centers, operated exclusively under EU law by Deutsche Telekom / T-Systems."
    de: "Der US CLOUD Act gewährt US-Behörden Zugriff auf Daten, die von US-Unternehmen gespeichert werden – selbst auf EU-Servern. Schrems II hat das Privacy Shield für ungültig erklärt. Ihre Compliance ist gefährdet. OpenTelekomCloud hält Ihre Daten in deutschen Rechenzentren – ausschließlich nach EU-Recht betrieben von Deutsche Telekom / T-Systems."
    da: "US CLOUD Act giver amerikanske myndigheder adgang til data, der opbevares af amerikanske virksomheder – selv på EU-servere. Schrems II ugyldiggjorde Privacy Shield. Din compliance er i fare. OpenTelekomCloud holder dine data i tyske datacentre, drevet udelukkende under EU-lovgivning af Deutsche Telekom / T-Systems."

  usCloud.title:
    en: "US CLOUD Act Risk"
    de: "Risiko durch den US CLOUD Act"
    da: "Risiko ved US CLOUD Act"

  usCloud.description:
    en: "US cloud providers are subject to the US CLOUD Act. US authorities may access your data at any time even if it's stored on EU servers."
    de: "US-Cloud-Anbieter unterliegen dem US CLOUD Act. US-Behörden können jederzeit auf Ihre Daten zugreifen – selbst wenn diese auf EU-Servern gespeichert sind."
    da: "Amerikanske cloududbydere er omfattet af US CLOUD Act. Amerikanske myndigheder kan til enhver tid få adgang til dine data – selv hvis de er lagret på EU-servere."

  euCloud.title:
